name: DAV Integration

on:
  workflow_call:
    inputs:
      dav-server:
        description: DAV server to run the tests against (stalwart or radicale)
        required: true
        type: string
      php-version:
        required: true
        type: string
      server-version:
        description: Nextcloud server branch
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: integration_davc

jobs:
  php-dav:
    runs-on: ubuntu-latest

    name: SQLite

    env:
      STALWART_ADMIN_PWD: adminpassword
      STALWART_URL: http://localhost:10080
      DAV_PROTOCOL: http
      DAV_HOST: localhost
      DAV_PORT: ${{ inputs.dav-server == 'stalwart' && '10080' || '5232' }}
      DAV_PATH: /.well-known/caldav
      DAV_DOMAIN: example.com
      DAV_USERNAME: user1@example.com
      # Must satisfy Stalwart's default zxcvbn password policy
      DAV_PASSWORD: violet-harbor-cactus-lantern

    # Only the service of the selected server is started, an empty image skips a service
    services:
      stalwart-service:
        image: ${{ inputs.dav-server == 'stalwart' && 'stalwartlabs/stalwart:v1.2.0' || '' }}
        env:
          STALWART_RECOVERY_ADMIN: admin:${{ env.STALWART_ADMIN_PWD }}
          # Base URL of the advertised discovery URLs, otherwise https://<defaultHostname> on port 443
          STALWART_PUBLIC_URL: ${{ env.STALWART_URL }}
        ports:
          - 10080:8080
          - 10025:25
          - 10143:143
          - 10993:993
      radicale-service:
        image: ${{ inputs.dav-server == 'radicale' && 'ghcr.io/kozea/radicale:3.9.2' || '' }}
        ports:
          - 5232:5232
        options: >-
          --health-cmd="curl -s -o /dev/null http://localhost:5232/"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Provision Stalwart
        if: inputs.dav-server == 'stalwart'
        env:
          STALWART_CONTAINER: ${{ job.services.stalwart-service.id }}
        run: |
          set -euo pipefail
          jmap() {
            jq -nc --argjson call "$1" '{using: ["urn:ietf:params:jmap:core", "urn:stalwart:jmap"], methodCalls: [$call]}' \
              | curl -sSf -u "admin:$STALWART_ADMIN_PWD" -H 'Content-Type: application/json' -d @- "$STALWART_URL/jmap/" \
              | jq -e '.methodResponses[0] | if .[0] == "error" or ((.[1].notCreated // .[1].notUpdated // {}) | length > 0) then error(tojson) else .[1] end'
          }
          wait_for() {
            timeout 120 sh -c "until curl -sf '$1' > /dev/null; do sleep 2; done"
          }

          # A fresh server starts in bootstrap mode and only accepts the Bootstrap object
          wait_for "$STALWART_URL/healthz/live"
          jmap "$(jq -nc --arg domain "$DAV_DOMAIN" '["x:Bootstrap/set", {"update": {"singleton": {
            "defaultHostname": ("mail." + $domain),
            "defaultDomain": $domain,
            "requestTlsCertificate": false,
            "generateDkimKeys": false,
            "tracer": {"@type": "Stdout"}
          }}}, "0"]')"

          # The configuration written by the bootstrap is only loaded on restart
          docker restart "$STALWART_CONTAINER"
          wait_for "$STALWART_URL/healthz/ready"

          domain_id=$(jmap "$(jq -nc --arg domain "$DAV_DOMAIN" '["x:Domain/query", {"filter": {"name": $domain}}, "0"]')" | jq -er '.ids[0]')
          jmap "$(jq -nc --arg domain "$domain_id" --arg name "${DAV_USERNAME%@*}" --arg pwd "$DAV_PASSWORD" '["x:Account/set", {"create": {"u1": {
            "@type": "User",
            "name": $name,
            "domainId": $domain,
            "credentials": {"0": {"@type": "Password", "secret": $pwd}}
          }}}, "0"]')"

      - name: Provision Radicale
        if: inputs.dav-server == 'radicale'
        env:
          RADICALE_CONTAINER: ${{ job.services.radicale-service.id }}
        run: |
          set -euo pipefail
          # A fresh server denies all logins, authentication is configured through files loaded on restart
          config_dir="$RUNNER_TEMP/radicale"
          mkdir -p "$config_dir"
          printf '[auth]\ntype = htpasswd\nhtpasswd_encryption = plain\n' > "$config_dir/config"
          printf '%s:%s\n' "$DAV_USERNAME" "$DAV_PASSWORD" > "$config_dir/users"
          chmod 644 "$config_dir/config" "$config_dir/users"
          docker cp "$config_dir" "$RADICALE_CONTAINER:/etc/radicale"
          docker restart "$RADICALE_CONTAINER"
          timeout 120 sh -c "until curl -s -o /dev/null 'http://$DAV_HOST:$DAV_PORT/'; do sleep 2; done"

          # Radicale does not create default collections, the tests expect at least one calendar and address book
          base="http://$DAV_HOST:$DAV_PORT/$DAV_USERNAME"
          curl -sSf -u "$DAV_USERNAME:$DAV_PASSWORD" -X MKCALENDAR "$base/calendar/"
          curl -sSf -u "$DAV_USERNAME:$DAV_PASSWORD" -X MKCOL -H 'Content-Type: application/xml' \
            --data '<?xml version="1.0"?><mkcol xmlns="DAV:" xmlns:CR="urn:ietf:params:xml:ns:carddav"><set><prop><resourcetype><collection/><CR:addressbook/></resourcetype></prop></set></mkcol>' \
            "$base/contacts/"

      - name: Set up DNS for DAV discovery
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsmasq-base
          sudo mkdir -p /etc/dnsmasq.d

          sudo cp /etc/resolv.conf /etc/dnsmasq-upstream-resolv.conf

          cat <<EOF | sudo tee /etc/dnsmasq.d/integration-davc.conf >/dev/null
          port=53
          listen-address=127.0.0.1
          bind-interfaces
          resolv-file=/etc/dnsmasq-upstream-resolv.conf
          local=/${{ env.DAV_DOMAIN }}/
          host-record=${{ env.DAV_DOMAIN }},127.0.0.1
          srv-host=_caldav._tcp.${{ env.DAV_DOMAIN }},${{ env.DAV_HOST }},${{ env.DAV_PORT }},0,0
          EOF

          sudo pkill dnsmasq || true
          sudo dnsmasq --conf-dir=/etc/dnsmasq.d

          printf 'nameserver 127.0.0.1\noptions timeout:1 attempts:3\n' | sudo tee /etc/resolv.conf >/dev/null

      - name: Verify DNS discovery records
        run: |
          php -r '$records = dns_get_record("_caldav._tcp.${{ env.DAV_DOMAIN }}", DNS_SRV); if ($records === false || $records === [] || ($records[0]["target"] ?? "") !== "${{ env.DAV_HOST }}") { fwrite(STDERR, "SRV lookup failed\n"); exit(1); }'
          getent hosts ${{ env.DAV_HOST }}

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: ${{ inputs.server-version }}

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ inputs.php-version }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
          # Temporary workaround for missing pcntl_* in PHP 8.3
          ini-values: disable_functions=

      - name: Set up dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer i

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=sqlite --database-name=nextcloud --admin-user admin --admin-pass admin
          ./occ config:system:set allow_local_remote_servers --value="true"
          ./occ app:enable --force ${{ env.APP_NAME }}

      - name: Run tests
        working-directory: apps/${{ env.APP_NAME }}
        run: composer run test:integration:dav

      - name: Print dav server logs
        if: ${{ failure() }}
        run: docker logs ${{ inputs.dav-server == 'stalwart' && job.services.stalwart-service.id || job.services.radicale-service.id }}
